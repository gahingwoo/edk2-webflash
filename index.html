<!doctype html>

<head>

  <title>RK3576 firmware flash</title>
  <meta name="description" content="Write edk2-rk3576 UEFI firmware or mainline U-Boot to a Rockchip RK3576 board over USB, from the browser.">
  <link rel="icon" href="assets/mark.svg?v=WASM_HASH">
  <script>
    // Cross-origin isolation through a service worker: GitHub Pages cannot
    // send COOP/COEP headers, and the USB code needs SharedArrayBuffer. The
    // first visit registers the worker and reloads once.
    if (!self.crossOriginIsolated && 'serviceWorker' in navigator) {
      navigator.serviceWorker.register('./coi-serviceworker.js', { scope: './' }).then(function () {
        var k = 'coi-reloaded';
        try { if (sessionStorage.getItem(k)) return; sessionStorage.setItem(k, '1'); } catch (e) { return; }
        location.reload();
      }, function (e) { console.warn('service worker:', e); });
    }
  </script>
  <script src="src/theme.js?v=WASM_HASH"></script>
  <link rel="stylesheet" href="assets/patternfly/patternfly-flash.css?v=WASM_HASH">

</head>
<body>
<div class="pf-v6-c-page">

      </div>
    </div>
    <div class="pf-v6-c-masthead__content masthead-actions">

      <a class="pf-v6-c-button pf-m-plain masthead-link" href="https://edk2.gahingwoo.com/flash.html"><span class="pf-v6-c-button__icon pf-m-start"><svg class="pf-v6-svg" fill="currentColor" viewBox="0 0 576 512" aria-hidden="true" role="img" width="1em" height="1em"><path d="M542.22 32.05c-54.8 3.11-163.72 14.43-230.96 55.59-4.64 2.84-7.27 7.89-7.27 13.17v363.87c0 11.55 12.63 18.85 23.28 13.49 69.18-34.82 169.23-44.32 218.7-46.92 16.89-.89 30.02-14.43 30.02-30.66V62.75c.01-17.71-15.35-31.74-33.77-30.7zM264.73 87.64C197.5 46.48 88.58 35.17 33.78 32.05 15.36 31.01 0 45.04 0 62.75V400.6c0 16.24 13.13 29.78 30.02 30.66 49.49 2.6 149.59 12.11 218.77 46.95 10.62 5.35 23.21-1.94 23.21-13.46V100.63c0-5.29-2.62-10.14-7.27-12.99z"/></svg></span><span class="pf-v6-c-button__text" data-i18n="page.docs">Documentation</span></a>
      <a class="pf-v6-c-button pf-m-plain masthead-link" href="https://github.com/gahingwoo/edk2-rk3576/releases"><span class="pf-v6-c-button__icon pf-m-start"><svg class="pf-v6-svg" fill="currentColor" viewBox="0 0 512 512" aria-hidden="true" role="img" width="1em" height="1em"><path d="M0 252.118V48C0 21.49 21.49 0 48 0h204.118a48 48 0 0 1 33.941 14.059l211.882 211.882c18.745 18.745 18.745 49.137 0 67.882L293.823 497.941c-18.745 18.745-49.137 18.745-67.882 0L14.059 286.059A48 48 0 0 1 0 252.118zM112 64c-26.51 0-48 21.49-48 48s21.49 48 48 48 48-21.49 48-48-21.49-48-48-48z"/></svg></span><span class="pf-v6-c-button__text" data-i18n="page.releases">Releases</span></a>

  </header>

  <div class="pf-v6-c-page__main-container">
    <main class="pf-v6-c-page__main" tabindex="-1" id="main-content">

      <section class="pf-v6-c-page__main-section" id="notices" hidden>
        <div class="pf-v6-c-page__main-body" id="notices-body"></div>
      </section>

      <section class="pf-v6-c-page__main-wizard pf-m-fill" aria-label="Write firmware">
          <div class="pf-v6-c-wizard">
            <button class="pf-v6-c-wizard__toggle" id="wizard-toggle" type="button" aria-label="Steps" data-i18n-aria="steps" aria-expanded="false">
              <span class="pf-v6-c-wizard__toggle-list">
                <span class="pf-v6-c-wizard__toggle-list-item"><span class="pf-v6-c-wizard__toggle-num" id="toggle-num">1</span> <span id="toggle-name">Board</span></span>
              </span>
              <span class="pf-v6-c-wizard__toggle-icon"><svg class="pf-v6-svg" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true" role="img" width="1em" height="1em"><path d="M18.71 5.29a.996.996 0 0 0-1.41 0l-7.29 7.29-7.3-7.29a.987.987 0 0 0-1.41-.02.987.987 0 0 0-.02 1.41l.02.02 7.65 7.65c.29.29.68.44 1.06.44s.77-.15 1.06-.44l7.65-7.65a.996.996 0 0 0 0-1.41Z"/></svg></span>
            </button>
            <div class="pf-v6-c-wizard__outer-wrap">
              <div class="pf-v6-c-wizard__inner-wrap">
                <nav class="pf-v6-c-wizard__nav" id="wizard-nav" aria-label="Steps" data-i18n-aria="steps">
                  <ol class="pf-v6-c-wizard__nav-list" role="list">
                    <li class="pf-v6-c-wizard__nav-item"><button class="pf-v6-c-wizard__nav-link" type="button" data-step="0"><span class="pf-v6-c-wizard__nav-link-main" data-i18n="step.board">Board</span></button></li>
                    <li class="pf-v6-c-wizard__nav-item"><button class="pf-v6-c-wizard__nav-link" type="button" data-step="1"><span class="pf-v6-c-wizard__nav-link-main" data-i18n="step.firmware">What to write</span></button></li>
                    <li class="pf-v6-c-wizard__nav-item"><button class="pf-v6-c-wizard__nav-link" type="button" data-step="2"><span class="pf-v6-c-wizard__nav-link-main" data-i18n="step.write">Review</span></button></li>
                  </ol>
                </nav>
                <div class="pf-v6-c-wizard__main" tabindex="-1" id="wizard-main">
                  <div class="pf-v6-c-wizard__main-body">

                    <div class="step pf-v6-l-stack pf-m-gutter" data-step="0">
                      <div class="pf-v6-l-stack__item">
                        <h1 class="pf-v6-c-title pf-m-h2" data-i18n="step.board">Board</h1>
                        <p class="step-lead" data-i18n="board.lead">The board to write. Each one says where its firmware goes.</p>
                      </div>
                      <div class="pf-v6-l-stack__item">
                        <form class="pf-v6-c-form" novalidate onsubmit="return false">
                          <div class="pf-v6-c-form__group" role="radiogroup" aria-labelledby="board-label">
                            <div class="pf-v6-c-form__group-label"><span class="pf-v6-c-form__label" id="board-label"><span class="pf-v6-c-form__label-text" data-i18n="board.label">Board</span></span></div>
                            <div class="pf-v6-c-form__group-control pf-m-stack" id="board-radios"></div>
                          </div>
                        </form>
                      </div>
                      <div class="pf-v6-l-stack__item">
                        <p class="muted" id="release-note"></p>
                      </div>
                    </div>

                    <div class="step pf-v6-l-stack pf-m-gutter" data-step="1" hidden>
                      <div class="pf-v6-l-stack__item">
                        <h1 class="pf-v6-c-title pf-m-h2" data-i18n="step.firmware">What to write</h1>
                        <p class="step-lead" id="firmware-lead"></p>
                      </div>
                      <div class="pf-v6-l-stack__item">
                        <form class="pf-v6-c-form" novalidate onsubmit="return false">
                          <div class="pf-v6-c-form__group">
                            <div class="pf-v6-c-form__group-label"><span class="pf-v6-c-form__label" id="channel-label"><span class="pf-v6-c-form__label-text" data-i18n="channel.label">UEFI firmware from</span></span></div>
                            <div class="pf-v6-c-form__group-control">
                              <div class="pf-v6-c-toggle-group" role="group" aria-labelledby="channel-label" id="channel-group"></div>
                              <div class="pf-v6-c-form__helper-text" aria-live="polite"><div class="pf-v6-c-helper-text"><div class="pf-v6-c-helper-text__item" id="channel-help-item"><span class="pf-v6-c-helper-text__item-text" id="channel-help"></span></div></div></div>
                            </div>
                          </div>
                        </form>
                      </div>
                      <div class="pf-v6-l-stack__item" id="channel-alert" hidden></div>
                      <div class="pf-v6-l-stack__item">
                        <form class="pf-v6-c-form" novalidate onsubmit="return false">
                          <div class="pf-v6-c-form__group" role="radiogroup" aria-label="Firmware" data-i18n-aria="step.firmware">
                            <div class="pf-v6-c-form__group-control pf-m-stack" id="target-radios"></div>
                          </div>
                        </form>
                      </div>
                      <div class="pf-v6-l-stack__item file-row" id="file-row" hidden>
                        <button class="pf-v6-c-button pf-m-secondary" type="button" id="file-button"><span class="pf-v6-c-button__text" data-i18n="fw.chooseFile">Choose a file</span></button>
                        <span class="detail" id="file-name">No file chosen</span>
                        <input type="file" id="file-input" accept=".img,.bin,application/octet-stream" hidden>
                      </div>
                    </div>

                    <div class="step pf-v6-l-stack pf-m-gutter" data-step="2" hidden>
                      <div class="pf-v6-l-stack__item">
                        <h1 class="pf-v6-c-title pf-m-h2" data-i18n="step.write">Review</h1>
                        <p class="step-lead" id="write-lead" data-i18n="write.lead">Nothing has been written yet. Check this before you go on.</p>
                      </div>
                      <div class="pf-v6-l-stack__item">
                        <dl class="pf-v6-c-description-list pf-m-horizontal pf-m-compact" id="review"></dl>
                      </div>
                      <div class="pf-v6-l-stack__item" id="review-alert" hidden></div>
                      <div class="pf-v6-l-stack__item" id="maskrom-block">
                        <div class="pf-v6-c-card">
                          <div class="pf-v6-c-card__title"><h2 class="pf-v6-c-card__title-text" data-i18n="maskrom.title">Put the board in MaskROM mode</h2></div>
                          <div class="pf-v6-c-card__body pf-v6-c-content">
                            <ol class="pf-v6-c-list" id="maskrom-steps"></ol>
                            <p id="maskrom-more"></p>
                          </div>
                        </div>
                      </div>
                      <div class="pf-v6-l-stack__item" id="erase-alert"></div>
                      <div class="pf-v6-l-stack__item" id="ack-block" hidden>
                        <label class="pf-v6-c-check" for="ack">
                          <input class="pf-v6-c-check__input" type="checkbox" id="ack">
                          <span class="pf-v6-c-check__label" data-i18n="ack.custom">This file is an image for this board and this storage.</span>
                        </label>
                      </div>
                      <div class="pf-v6-l-stack__item" id="ci-ack-block" hidden>
                        <label class="pf-v6-c-check" for="ci-ack">
                          <input class="pf-v6-c-check__input" type="checkbox" id="ci-ack">
                          <span class="pf-v6-c-check__label" data-i18n="ack.ci">I understand that this CI build has not been tested on a board and may not work.</span>
                        </label>
                      </div>
                      <div class="pf-v6-l-stack__item" id="run-block" hidden>
                        <div class="pf-v6-l-stack pf-m-gutter">
                          <div class="pf-v6-l-stack__item">
                            <div class="pf-v6-c-progress pf-m-sm" id="progress">
                              <div class="pf-v6-c-progress__description" id="progress-title">Starting</div>
                              <div class="pf-v6-c-progress__status" aria-hidden="true"><span class="pf-v6-c-progress__measure" id="progress-measure">0%</span></div>
                              <div class="pf-v6-c-progress__bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-labelledby="progress-title" id="progress-bar">
                                <div class="pf-v6-c-progress__indicator" id="progress-indicator" style="width:0%"></div>
                              </div>
                            </div>
                          </div>
                          <div class="pf-v6-l-stack__item" id="run-alert"></div>
                          <div class="pf-v6-l-stack__item">
                            <div class="pf-v6-c-expandable-section" id="log-section">
                              <div class="pf-v6-c-expandable-section__toggle">
                                <button class="pf-v6-c-button pf-m-link" type="button" id="log-toggle" aria-expanded="false" aria-controls="log-content">
                                  <span class="pf-v6-c-button__icon pf-m-start"><span class="pf-v6-c-expandable-section__toggle-icon"><svg class="pf-v6-svg" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true" role="img" width="1em" height="1em"><path d="M18.71 5.29a.996.996 0 0 0-1.41 0l-7.29 7.29-7.3-7.29a.987.987 0 0 0-1.41-.02.987.987 0 0 0-.02 1.41l.02.02 7.65 7.65c.29.29.68.44 1.06.44s.77-.15 1.06-.44l7.65-7.65a.996.996 0 0 0 0-1.41Z"/></svg></span></span>
                                  <span class="pf-v6-c-button__text" data-i18n="run.log">Log</span>
                                </button>
                              </div>
                              <div class="pf-v6-c-expandable-section__content log" id="log-content" role="region" aria-labelledby="log-toggle" hidden>
                                <div class="pf-v6-c-code-block"><div class="pf-v6-c-code-block__content"><pre class="pf-v6-c-code-block__pre"><code class="pf-v6-c-code-block__code" id="log" aria-live="polite"></code></pre></div></div>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>

                  </div>
                </div>
              </div>
              <footer class="pf-v6-c-wizard__footer">
                <div class="pf-v6-l-stack pf-m-gutter">
                  <p class="pf-v6-l-stack__item footer-note" id="footer-note"></p>
                  <div class="pf-v6-l-stack__item pf-v6-c-action-list">
                    <div class="pf-v6-c-action-list__group">
                      <div class="pf-v6-c-action-list__item"><button class="pf-v6-c-button pf-m-secondary" type="button" id="back" hidden><span class="pf-v6-c-button__text" data-i18n="back">Back</span></button></div>
                      <div class="pf-v6-c-action-list__item"><button class="pf-v6-c-button pf-m-primary" type="button" id="next"><span class="pf-v6-c-button__text">Next</span></button></div>
                    </div>
                  </div>
                </div>
              </footer>
            </div>
          </div>
      </section>
    </main>
  </div>
</div>

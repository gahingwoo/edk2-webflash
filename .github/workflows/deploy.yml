name: Deploy to GitHub Pages

on:
  # Every branch is tested and built; only main is deployed.
  push:
  workflow_dispatch:
  # The UEFI images are bundled at deploy time, so a new edk2-rk3576 release,
  # or a new build of its rolling "ci" release, reaches the site on the next
  # run.  Hourly, the check job compares what the release channels point at
  # with the fingerprint in the live firmware.json and the site is only
  # rebuilt when they differ.
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Channel choice of the bundler
        run: python3 -m unittest discover -s tests -v
      - name: flash.js in Chrome
        run: |
          python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 1
          CHROME=google-chrome python3 tests/browser.py test http://localhost:8000/tests/flash.test.html

  # On the hourly schedule: is there anything new to bundle?  While
  # edk2-rk3576's build replaces the ci release there is briefly none; that
  # is not a change, or the site would lose its CI build until the next hour.
  check:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    outputs:
      changed: ${{ steps.fp.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - id: fp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(python3 scripts/bundle-firmware.py --fingerprint)
          live=$(curl -sf https://flash.gahingwoo.com/firmware.json \
            | python3 -c 'import json, sys; print(json.load(sys.stdin).get("fingerprint", ""))' || true)
          echo "now:  $now"
          echo "live: $live"
          if [ "$now" = "$live" ] || [ "${now##*;ci=}" = "" ]; then changed=false; else changed=true; fi
          echo "changed=$changed" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: [test, check]
    if: >-
      always() && needs.test.result == 'success'
      && (github.event_name != 'schedule' || needs.check.outputs.changed == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Clone rkdeveloptool (GPL v2) source and its libusb patches (LGPL derivative).
      # We only use the C++ source and patches — NOT jjm2473's JS wrapper code.
      - name: Clone rkdeveloptool source & patches
        run: |
          git clone --depth=1 https://github.com/jjm2473/rktool-webusb.git _rktool
          cd _rktool
          git submodule update --init --depth=1 rkdeveloptool

      # Download libusb 1.0.29 (LGPL 2.1) and apply the Emscripten-specific patches.
      - name: Download & patch libusb 1.0.29
        run: |
          mkdir -p _rktool/ref
          curl -fsSL https://github.com/libusb/libusb/releases/download/v1.0.29/libusb-1.0.29.tar.bz2 \
            | tar -xj -C _rktool/ref
          cd _rktool/ref/libusb-1.0.29
          for p in ../../patches/libusb/*.patch; do patch -p1 < "$p"; done
          cd ../../rkdeveloptool
          for p in ../patches/rkdeveloptool/*.patch; do patch -p1 < "$p"; done

      - name: Setup Emscripten 3.1.48
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.48

      # Build libusb as a static WASM library.
      #
      # The "val accessed from wrong thread" assertion in val.h is caused by
      # C++20 coroutines in emscripten_webusb.cpp: when co_await suspends and
      # _emval_coro_resume() resumes it, pthread_self() no longer matches the
      # thread stored in the val, triggering:
      #   assert(pthread_equal(thread, pthread_self()))
      #
      # With coi-serviceworker.js providing SharedArrayBuffer, libusb's
      # 001-fix-hangs.patch uses Atomics.waitAsync (not the polling fallback),
      # which keeps ASYNCIFY thread-local state intact — so the assertion
      # should PASS.  Do NOT add -DNDEBUG: disabling the assert masks a
      # different emval use-after-free bug that surfaces next.
      # Instead, ensure SharedArrayBuffer is available (coi-serviceworker.js)
      # and set up the WASM filesystem correctly (config.ini, log/, cwd=/tmp).
      - name: Build libusb for WASM
        run: |
          mkdir -p _rktool/ref/libusb-1.0.29/build-wasm
          cd _rktool/ref/libusb-1.0.29/build-wasm
          emconfigure ../configure \
            --host=wasm32-unknown-emscripten \
            --disable-shared --enable-static --disable-udev
          # libusb configure.ac tests whether emcc accepts -pthread and, if so,
          # sets THREAD_CFLAGS=-pthread in the Makefile.  On Linux CI emcc does
          # accept -pthread, which makes the compiler define _REENTRANT.  That
          # enables the pthread_equal() assertion in emscripten/val.h (line 400)
          # which fires after ASYNCIFY suspend/resume because pthread_self() no
          # longer matches the stored thread pointer.  Strip the flag so the
          # assertion is not compiled in — exactly what happens on macOS where
          # emcc rejects -pthread under -Werror and THREAD_CFLAGS is left empty.
          find . -name 'Makefile' | xargs sed -i 's/ -pthread/ -matomics/g'
          emmake make -j$(nproc)

      - name: Build rkdeveloptool WASM
        run: |
          RKTOOL=$PWD/_rktool
          LIBUSB_A=$RKTOOL/ref/libusb-1.0.29/build-wasm/libusb/.libs/libusb-1.0.a
          LIBUSB_INC=$RKTOOL/ref/libusb-1.0.29/libusb
          mkdir -p wasm-build dist

          # Use our own CMakeLists.wasm.txt (does not call build_wasm.sh,
          # so no dependency on macOS-only 'crc32' command).
          cp CMakeLists.wasm.txt wasm-build/CMakeLists.txt
          emcmake cmake \
            -S wasm-build -B wasm-build/build \
            -DRKTOOL_ROOT=$RKTOOL \
            -DLIBUSB_STATIC_LIB=$LIBUSB_A \
            -DLIBUSB_INCLUDE_DIR=$LIBUSB_INC \
            -DDIST_DIR=$PWD/dist \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build wasm-build/build --parallel $(nproc)

      - name: Assemble site
        run: |
          mkdir -p _site/dist _site/src

          # WASM binary + JS glue
          cp dist/rkdeveloptool.js   _site/dist/
          cp dist/rkdeveloptool.wasm _site/dist/

          # Our own JS files (written from scratch, no jjm2473 code), the page
          # CSS and the vendored PatternFly parts
          cp src/*.js _site/src/
          cp -r assets _site/
          rm -f _site/assets/patternfly/build.sh

          # Cross-Origin Isolation Service Worker (enables SharedArrayBuffer)
          cp coi-serviceworker.js _site/

          # Static assets
          cp index.html            _site/
          cp rk3576_spl_loader.bin   _site/
          cp rock4d-spi-uboot.img   _site/
          cp cm5io-sdcard-uboot.img _site/

          # Cache-busting: replace the 'WASM_HASH' placeholder in all .html and
          # .js files with a hash of everything the page loads: the WASM binary,
          # the scripts, the stylesheets and the page itself.
          WASM_HASH=$(cat _site/dist/rkdeveloptool.wasm _site/dist/rkdeveloptool.js _site/src/*.js \
            _site/assets/app.css _site/assets/patternfly/patternfly-flash.css _site/index.html | sha256sum | cut -c1-8)
          echo "Site hash prefix: $WASM_HASH"
          find _site -name '*.html' -o -name '*.js' \
            | xargs sed -i "s/WASM_HASH/${WASM_HASH}/g"

      # The UEFI images of three channels: the latest release, the newest
      # release counting pre-releases, and the rolling "ci" release of
      # edk2-rk3576's main.  GitHub release downloads carry no CORS headers,
      # so the page cannot fetch them from github.com; serve them from this
      # origin like the loader and the U-Boot images, under fixed names per
      # channel.  Each is checked against its release's SHA256SUMS.txt here,
      # and firmware.json records its version, size and SHA-256, which the
      # page shows and checks the download against.  The eMMC images are used
      # on the CM5-IO and the TaishanPi 3M because `rkdeveloptool wl` writes
      # the eMMC on those boards.
      - name: Bundle the edk2-rk3576 release channels
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/bundle-firmware.py _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: always() && needs.build.result == 'success' && github.ref == 'refs/heads/main'
    # One deploy at a time, queued rather than cancelled.  Only a run that
    # built something gets here, so an hourly check that found nothing new
    # never displaces a deploy of a push.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4

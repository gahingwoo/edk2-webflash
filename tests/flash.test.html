<!doctype html>
<meta charset="utf-8">
<title>flash.js tests</title>
<!-- Open through a web server (python3 -m http.server) and read the list.
     Each line is PASS or FAIL; the last line is the count. -->
<pre id="out"></pre>
<script type="module">
// The same URLs as the page's imports, so the modules share one i18n.js.
import { BOARDS, boardById, customTarget, channelImage, withImage } from '../src/boards.js?v=WASM_HASH';
import { prepare, runFlash, checkSettingsSlot, checkDownload } from '../src/flash.js?v=WASM_HASH';
import { setLang, t, tr } from '../src/i18n.js?v=WASM_HASH';
setLang('en', false);

const MIB = 1048576;
const out = document.getElementById('out');
let failed = 0, passed = 0;
function ok(cond, name) { cond ? passed++ : failed++; out.textContent += `${cond ? 'PASS' : 'FAIL'} ${name}\n`; }
async function throws(fn, re, name) {
  try { await fn(); ok(false, name + ' (did not throw)'); } catch (e) { ok(re.test(e.message), `${name}: ${e.message}`); }
}

// An image whose every 512-byte sector starts with its own number.
function image(bytes) {
  const buf = new Uint8Array(bytes);
  const view = new DataView(buf.buffer);
  for (let s = 0; s * 512 < bytes; s++) view.setUint32(s * 512, s, true);
  return new Blob([buf]);
}
// A minimal FIT: /images/nvdata { data-offset = <nvOffset>; }, as edk2-rk3576
// builds it (external data, after the header rounded up to 4 bytes).
function fit(nvOffset) {
  const strings = new TextEncoder().encode('data-offset\0');
  const words = [];
  const node = (name) => { words.push(1); const b = new TextEncoder().encode(name + '\0'); const pad = new Uint8Array((b.length + 3) & ~3); pad.set(b); for (let i = 0; i < pad.length; i += 4) words.push(new DataView(pad.buffer).getUint32(i)); };
  node(''); node('images'); node('nvdata'); words.push(3, 4, 0, nvOffset, 2, 2, 2, 9);
  const offStruct = 40, offStrings = offStruct + words.length * 4, total = offStrings + strings.length;
  const buf = new Uint8Array(total), v = new DataView(buf.buffer);
  v.setUint32(0, 0xd00dfeed); v.setUint32(4, total); v.setUint32(8, offStruct); v.setUint32(12, offStrings); v.setUint32(16, 40);
  v.setUint32(20, 17); v.setUint32(24, 16); v.setUint32(32, strings.length); v.setUint32(36, words.length * 4);
  words.forEach((w, i) => v.setUint32(offStruct + i * 4, w));
  buf.set(strings, offStrings);
  return buf;
}
// A 32 MiB eMMC image with that FIT at sector 16384, its nvdata slot at sector 43648.
async function emmcImage(nvLba = 43648) {
  const buf = new Uint8Array(await image(32 * MIB).arrayBuffer());
  const f0 = fit(0), off = nvLba * 512 - 16384 * 512 - ((f0.length + 3) & ~3);
  buf.set(fit(off), 16384 * 512);
  return new Blob([buf]);
}
async function firstSector(blob) { return new DataView(await blob.slice(0, 4).arrayBuffer()).getUint32(0, true); }

function fakes({ serial = '', dbExit = 0, wlExit = 0 } = {}) {
  const calls = [], mounted = {};
  return {
    calls, mounted,
    rk: {
      mountBlob: async (name, blob) => { mounted[name] = blob; return { dir: '/m/' + name, path: '/m/' + name + '/' + name }; },
      umount: async ({ dir }) => { calls.push('umount ' + dir); },
      run: async (args) => { calls.push(args.join(' ')); return { exitCode: args[0] === 'db' ? dbExit : args[0] === 'wl' ? wlExit : 0 }; },
    },
    usb: { requestDevice: async () => { calls.push('requestDevice'); return { serialNumber: serial, productId: 0x350e, productName: '' }; } },
    ui: { status() {}, log() {}, progress() {}, reconnect: async (request) => { calls.push('reconnect'); await request(); } },
  };
}

const tspi = boardById('tspi3m'), cm5 = boardById('cm5io'), rock = boardById('rock4d');
const img32 = await emmcImage(), img16 = image(16 * MIB);
const fetchBlob = async (url) => (url.includes('loader') ? new Blob([new Uint8Array(1000)]) : url.includes('rock4d') || url.includes('uboot') ? img16 : img32);

// prepare()
{
  const t = tspi.targets.find((x) => x.id === 'uefi-keep');
  const part = prepare(tspi, t, img32);
  ok(part.size === (43648 - 64) * 512, 'TaishanPi firmware part stops at the settings slot (sector 43648)');
  ok(await firstSector(part) === 64, 'TaishanPi firmware part starts at image sector 64');
  ok(t.lba === 64, 'TaishanPi firmware part is written at sector 64');
  await throws(() => prepare(tspi, t, image(8 * MIB)), /shorter/, 'a short image is refused');
}
{
  const t = cm5.targets.find((x) => x.id === 'uefi-keep');
  const part = prepare(cm5, t, img32);
  ok(part.size === (43648 - 64) * 512 && await firstSector(part) === 64 && t.lba === 64, 'CM5-IO firmware part: sector 64 up to the settings slot, written at sector 64');
}
// checkSettingsSlot()
for (const b of [tspi, cm5]) {
  const t = b.targets.find((x) => x.id === 'uefi-keep');
  let threw = null;
  try { await checkSettingsSlot(img32, t, t.keepsSettings); } catch (e) { threw = e; }
  ok(!threw, `${b.id}: the settings slot is found where the write stops` + (threw ? ': ' + threw.message : ''));
  const moved = await emmcImage(43650);
  await throws(() => checkSettingsSlot(moved, t, t.keepsSettings), /cannot keep the settings/, `${b.id}: a moved settings slot is refused`);
  await throws(() => checkSettingsSlot(image(32 * MIB), t, t.keepsSettings), /no FIT/, `${b.id}: an image without a FIT is refused`);
}
for (const b of BOARDS) for (const t of b.targets) {
  const whole = prepare(b, t, t.file.includes('rock4d') || t.file.includes('uboot') ? img16 : img32);
  if (!t.slice) ok(t.lba === 0 && whole.size > 0, `${b.id}/${t.id}: whole image at sector 0`);
}
await throws(() => prepare(rock, customTarget(new File([new Uint8Array(17 * MIB)], 'big.img')), new Blob([new Uint8Array(17 * MIB)])), /does not fit/, 'ROCK 4D: a file larger than the SPI NOR is refused');
await throws(() => prepare(cm5, cm5.targets[0], new Blob([])), /empty/, 'an empty image is refused');

// runFlash()
{
  const f = fakes();
  await runFlash({ ...f, fetchBlob, board: tspi, target: tspi.targets.find((x) => x.id === 'uefi-keep') });
  ok(f.calls.join(' | ') === 'requestDevice | db /m/loader.bin/loader.bin | reconnect | requestDevice | wl 64 /m/firmware.img/firmware.img | rd | umount /m/loader.bin | umount /m/firmware.img',
    'MaskROM: db, second device prompt, wl at the target sector, rd: ' + f.calls.join(' | '));
  ok(f.mounted['firmware.img'].size === (43648 - 64) * 512, 'MaskROM: only the firmware part is handed to wl');
}
{
  const f = fakes({ serial: 'abc' });
  await runFlash({ ...f, fetchBlob, board: rock, target: rock.targets[0] });
  ok(f.calls.join(' | ').startsWith('requestDevice | wl 0 '), 'loader mode: no db, no second prompt');
}
{
  const f = fakes({ dbExit: 1 });
  await throws(() => runFlash({ ...f, fetchBlob, board: cm5, target: cm5.targets[0] }), /Nothing was written/, 'db failure stops the run');
  ok(!f.calls.some((c) => c.startsWith('wl')), 'db failure: wl is never run');
  ok(f.calls.filter((c) => c.startsWith('umount')).length === 2, 'db failure: both files are unmounted');
}
{
  const f = fakes();
  await throws(() => runFlash({ ...f, fetchBlob: async (u) => (u.includes('loader') ? new Blob([1]) : image(8 * MIB)), board: tspi, target: tspi.targets.find((x) => x.id === 'uefi-keep') }),
    /shorter/, 'a short download stops the run');
  ok(!f.calls.some((c) => c.startsWith('db') || c.startsWith('wl')), 'a short download: nothing is sent to the board');
}
{
  const f = fakes({ wlExit: 2 });
  await throws(() => runFlash({ ...f, fetchBlob, board: cm5, target: cm5.targets[0] }), /write it again/, 'wl failure is reported');
  ok(!f.calls.includes('rd'), 'wl failure: the board is not reset');
}
{
  const f = fakes();
  const file = new File([new Uint8Array(2 * MIB)], 'mine.img');
  await runFlash({ ...f, fetchBlob, board: cm5, target: customTarget(file) });
  ok(f.mounted['firmware.img'] === file && f.calls.some((c) => c.startsWith('wl 0 ')), 'a custom file is written whole from sector 0');
}

// Release channels: a UEFI target with the CI image of firmware.json put in.
async function sha256(blob) {
  return [...new Uint8Array(await crypto.subtle.digest('SHA-256', await blob.arrayBuffer()))].map((b) => b.toString(16).padStart(2, '0')).join('');
}
const imgSha = await sha256(img32);
const versions = { channels: {
  stable: { tag: '0.4.1', images: { tspi3m: { version: '0.4.1', file: 'tspi3m-emmc-edk2.img', size: img32.size, sha256: imgSha } } },
  ci: { tag: 'ci', commit: 'cbbb844608582bc7f0bd0f6a89d94e62e6872735', images: { tspi3m: { version: 'ci-cbbb844', file: 'ci/tspi3m-emmc-edk2.img', size: img32.size, sha256: imgSha } } },
} };
{
  const keep = tspi.targets.find((x) => x.id === 'uefi-keep');
  const ci = withImage(keep, channelImage(versions, 'ci', 'tspi3m'), 'ci');
  ok(ci.file === 'ci/tspi3m-emmc-edk2.img' && ci.version === 'ci-cbbb844' && ci.sha256 === imgSha && ci.channel === 'ci', 'CI channel: the CI file, version and checksum are put in');
  ok(ci.lba === 64 && ci.slice[1] === 43648 * 512 && ci.keepsSettings === keep.keepsSettings, 'CI channel: keep the partitions still stops at the settings slot');
  ok(withImage(keep, channelImage(versions, 'ci', 'cm5io'), 'ci') === null, 'CI channel without an image for the board: no target');
  ok(withImage(tspi.targets.find((x) => x.id === 'uefi'), null, 'ci') === null, 'no image: a UEFI target cannot be written');
  const uboot = cm5.targets.find((x) => x.id === 'uboot');
  ok(withImage(uboot, null, 'ci') === uboot, 'U-Boot is the same in every channel');
  ok(channelImage(null, 'ci', 'tspi3m') === null && channelImage(versions, 'prerelease', 'tspi3m') === null, 'a channel firmware.json lacks has no image');

  let threw = null;
  try { await checkDownload(img32, ci); } catch (e) { threw = e; }
  ok(!threw, 'checkDownload: the image firmware.json describes is accepted' + (threw ? ': ' + threw.message : ''));
  await throws(() => checkDownload(img32, { ...ci, sha256: '0'.repeat(64) }), /does not match its SHA-256/, 'checkDownload: another SHA-256 is refused');
  await throws(() => checkDownload(image(8 * MIB), ci), /not the 33554432 bytes/, 'checkDownload: another size is refused');

  const f = fakes();
  const urls = [];
  await runFlash({ ...f, fetchBlob: async (u) => { urls.push(u); return fetchBlob(u); }, board: tspi, target: ci });
  ok(urls.includes(`./ci/tspi3m-emmc-edk2.img?v=${imgSha.slice(0, 16)}`), 'CI write: the CI image is fetched, with its checksum in the query: ' + urls.join(' '));
  ok(f.calls.includes('wl 64 /m/firmware.img/firmware.img') && f.mounted['firmware.img'].size === (43648 - 64) * 512, 'CI write: sectors 64 to 43647 only, the saved settings stay');

  const g = fakes();
  await throws(() => runFlash({ ...g, fetchBlob: async (u) => (u.includes('loader') ? new Blob([1]) : emmcImage(43648).then((b) => new Blob([b, new Uint8Array(1)]))), board: tspi, target: ci }),
    /should be/, 'a download that is not the described image stops the run');
  ok(!g.calls.some((c) => c.startsWith('db') || c.startsWith('wl')), 'a mismatching download: nothing is sent to the board');
}
// Chinese
{
  setLang('zh', false);
  ok(/未写入任何内容/.test((() => { try { prepare(cm5, cm5.targets[0], new Blob([])); } catch (e) { return e.message; } return ''; })()), 'Chinese: errors are in Chinese');
  ok(tr(tspi.targets[1].label) === 'UEFI 固件，保留分区' && t('channel.ci') === 'CI 构建', 'Chinese: board and page wording');
  setLang('en', false);
  ok(tr(tspi.targets[1].label) === 'UEFI firmware, keep the partitions', 'back to English');
}

out.textContent += `\n${passed} passed, ${failed} failed\n`;
document.title = failed ? 'FAILED' : 'passed';
</script>
